<svg xmlns="http://www.w3.org/2000/svg" width="716" height="412" viewBox="0 0 716 412" role="img" aria-label="heat3d-dcs-maps fit flight.csv (synthetic install)">
<rect width="716" height="412" rx="8" fill="#1e1f24"/>
<rect width="716" height="26" rx="8" fill="#2c2e35"/><rect y="18" width="716" height="8" fill="#2c2e35"/>
<circle cx="16" cy="13" r="5" fill="#ff5f57"/><circle cx="32" cy="13" r="5" fill="#febc2e"/><circle cx="48" cy="13" r="5" fill="#28c840"/>
<text x="358.0" y="18" fill="#9aa0aa" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle">heat3d-dcs-maps fit flight.csv (synthetic install)</text>
<g font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="14" xml:space="preserve" style="white-space:pre">
<text x="16" y="50" fill="#7ee787" xml:space="preserve" style="white-space:pre">$&#160;heat3d-dcs-maps&#160;fit&#160;flight.csv</text>
<text x="16" y="70" fill="#d6d9df" xml:space="preserve" style="white-space:pre">{</text>
<text x="16" y="90" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&quot;type&quot;:&#160;&quot;transverse_mercator&quot;,</text>
<text x="16" y="110" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&quot;ellipsoid&quot;:&#160;&quot;WGS84&quot;,</text>
<text x="16" y="130" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&quot;latitude_of_origin&quot;:&#160;0,</text>
<text x="16" y="150" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&quot;central_meridian&quot;:&#160;45,</text>
<text x="16" y="170" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&quot;scale_factor&quot;:&#160;0.9996,</text>
<text x="16" y="190" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&quot;false_easting&quot;:&#160;12345.600784032513,</text>
<text x="16" y="210" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&quot;false_northing&quot;:&#160;-3499999.9987115776,</text>
<text x="16" y="230" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&quot;axes&quot;:&#160;&quot;DCS&#160;x&#160;=&#160;northing&#160;+&#160;false_northing,&#160;z&#160;=&#160;easting&#160;+&#160;false_easting&quot;,</text>
<text x="16" y="250" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&quot;constants_from&quot;:&#160;&quot;fitted&#160;to&#160;a&#160;recording&#160;that&#160;held&#160;both&quot;,</text>
<text x="16" y="270" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&quot;points&quot;:&#160;9,</text>
<text x="16" y="290" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&quot;rms_metres&quot;:&#160;0.003</text>
<text x="16" y="310" fill="#d6d9df" xml:space="preserve" style="white-space:pre">}</text>
<text x="16" y="330" fill="#d6d9df" xml:space="preserve" style="white-space:pre">a&#160;good&#160;fit&#160;(0.00&#160;m&#160;rms&#160;over&#160;9&#160;points);&#160;use&#160;it&#160;with:</text>
<text x="16" y="350" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;heat3d-dcs-maps&#160;level&#160;&lt;theatre&gt;&#160;--projection&#160;45&#160;12345.601&#160;-3499999.999&#160;-o&#160;&lt;out&gt;</text>
<text x="16" y="370" fill="#7ee787" xml:space="preserve" style="white-space:pre">$&#160;echo&#160;$?</text>
<text x="16" y="390" fill="#d6d9df" xml:space="preserve" style="white-space:pre">0</text>
</g></svg>
